name: search_care
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.6
  firebase_app_check: ^0.3.2+6
  image_picker: ^1.1.2
  firebase_rules: ^0.2.1
  intl: ^0.20.2
  google_maps_flutter: ^2.12.2
  geolocator: ^14.0.1
  google_place: ^0.4.7
  pdf: ^3.11.3
  printing: ^5.14.2
  csv: ^6.0.0
  file_picker: ^10.2.0
  mailer: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/search_care.jpeg

# Correct placement of flutter_icons at the root level
flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/search_care.jpeg"
  min_sdk_android: 21
